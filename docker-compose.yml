# 定义开发配置模板
x-backend-develop: &backend-develop
  watch:
    - action: sync
      path: ./backend/gen_ui_backend
      target: /app/gen_ui_backend
    - action: sync
      path: ./backend/pyproject.toml
      target: /app/pyproject.toml
    - action: sync
      path: ./backend/README.md
      target: /app/README.md
    - action: rebuild
      path: ./backend/pyproject.toml
    - action: rebuild
      path: ./backend/gen_ui_backend/requirements.txt

x-frontend-develop: &frontend-develop
  watch:
    - action: sync
      path: ./frontend/app
      target: /app/app
    - action: sync
      path: ./frontend/components
      target: /app/components
    - action: sync
      path: ./frontend/lib
      target: /app/lib
    - action: sync
      path: ./frontend/utils
      target: /app/utils
    - action: sync
      path: ./frontend/ai
      target: /app/ai
    - action: sync
      path: ./frontend/public
      target: /app/public
    - action: rebuild
      path: ./frontend/package.json
    - action: rebuild
      path: ./frontend/yarn.lock

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AI_SERVICE_PROVIDER=${AI_SERVICE_PROVIDER:-azure}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_CALLBACKS_BACKGROUND=${LANGCHAIN_CALLBACKS_BACKGROUND:-true}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GEOCODE_API_KEY=${GEOCODE_API_KEY}
    env_file:
      - .env
    volumes:
      # 使用volume挂载实现热重载
      - ./backend/gen_ui_backend:/app/gen_ui_backend
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/README.md:/app/README.md
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 应用后端开发配置
    develop: *backend-develop

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 使用 volume 挂载实现热重载
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/utils:/app/utils
      - ./frontend/ai:/app/ai
      - ./frontend/public:/app/public
    # 应用前端开发配置
    develop: *frontend-develop

networks:
  default:
    name: gen-ui-network
